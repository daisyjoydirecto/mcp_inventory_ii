<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- open the connection to Google early, so the first login and sync start sooner -->
    <link rel="preconnect" href="https://script.google.com" />
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>MCP Meat Inventory</title>
    <!--
      ================================================================
       MCP Meat Inventory — M. Montesclaros Farms Inc.
       Paste your two Google links below, save, and upload this file
       to GitHub Pages. Every device then uses them.
      ================================================================
    -->
    <script>
      window.MCP_CONFIG = {
        // Apps Script: Deploy > New deployment > Web app (Execute as: Me, Who has access: Anyone).
        // Used for logins and for saving Dispatch / Stock In / Adjustments.
        appsScriptUrl: 'https://script.google.com/macros/s/AKfycbwVugKoA1C1uPtbfGE-if2BroitkTHhqXA1YHBFr5BJnJjsv-55CWj6qAWoCQfjyTxC/exec',

        // Google Sheet: File > Share > Publish to web > tick ONLY Items, Transactions,
        // Documents, Availability > Comma-separated values (.csv) > Publish. Paste any one of the links.
        // Used for reading stock. Leave '' to read through Apps Script instead.
        publishedSheetUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLKo6lhsAU_UeiC_GosGFFVRkrCd_KaOG9J3XjTTYwxNti23LbTbVwWvMuwe-sTfybeQw_Qj-85ttF/pub?output=csv',

        // Dispatch form: title of the batch-code column (code = slaughter date + fabrication code)
        lotLabel: 'LOT NO.',

        // Dispatch Form: Business Unit choices
        businessUnits: ['MMEI', 'MMFI', 'MMHI', 'MMDC', 'MMHC', 'MGT', 'Institutional / Hotel & Resto', 'Walk-In', 'Volumer'],

        // Cutting Yield: shrinkage or cutting loss at +/- this % or more is red-flagged
        lossAlertPct: 2,

        // App switch button (login screen and header): the Sales Entry dashboard
        salesEntryUrl: 'https://daisyjoydirecto.github.io/sml-mcpsalesentry/',

        // Link shown in the header
        salesDashboardUrl: 'https://daisyjoydirecto.github.io/MMFI_MCP-SALES-DASHBOARD/',
      };
    </script>

.sl-thermal { width:101.6mm; height:76.2mm; }
.sl-sheet { display:grid; grid-auto-rows:76.2mm; justify-content:center; align-content:start; }
.sl-page { break-after:page; page-break-after:always; }
.sl-page:last-child { break-after:auto; page-break-after:auto; }
.sl { width:101.6mm; height:76.2mm; padding:2mm 3mm 1.6mm; display:flex; flex-direction:column; gap:.45mm; border:.3mm solid #000; overflow:hidden;
  background:#fff; color:#000; font-family:Arial,Helvetica,sans-serif; box-sizing:border-box; }
.sl * { box-sizing:border-box; }
.sl-sheet .sl { border-style:dashed; }
.sl-fitpage .sl { border-style:solid; border-width:.35mm; }
.sl-fit { overflow:hidden; }
.sl .mono { font-family:"Courier New",monospace; }
.sl-head { display:flex; gap:1mm; align-items:center; border-bottom:.3mm solid #000; padding-bottom:.4mm; margin-right:-1.5mm; margin-top:-.8mm; }
.sl-hl { flex:1; min-width:0; display:flex; flex-direction:column; gap:.4mm; }
.sl-top { display:flex; align-items:center; gap:2mm; }
.sl-logo { height:5.4mm; } .sl-ttl { font-size:3.3mm; letter-spacing:.3mm; font-weight:700; }
.sl-qr { text-align:center; } .sl-qr svg { width:18mm; height:18mm; display:block; }
.sl-qr small { display:block; font-size:1.8mm; margin-top:-.8mm; }
.sl-name { font-size:4.6mm; font-weight:900; line-height:1.05; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sl-sub { font-size:2.35mm; color:#222; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sl-grid { flex:1; display:grid; grid-template-columns:20mm 1fr; align-content:start; row-gap:.25mm; align-items:end; }
.sl-k { font-size:2.2mm; font-weight:700; color:#222; letter-spacing:.1mm; padding-bottom:.4mm; }
.sl-line { border-bottom:.25mm solid #000; height:6mm; position:relative; }
.sl-line.u { width:62%; } .sl-line.u span { position:absolute; right:-5mm; bottom:0; font-size:2.6mm; }
.sl-chk { display:flex; align-items:flex-end; gap:2.2mm; font-size:2.45mm; height:6mm; padding-bottom:.3mm; }
.sl-no { font-size:2.6mm; font-weight:700; } .sl-nol { flex:1; height:4.8mm; }
.sl-cb { display:inline-flex; align-items:center; gap:.8mm; white-space:nowrap; }
.sl-cb i { width:3.2mm; height:3.2mm; border:.25mm solid #000; display:inline-block; }
.sl-store { text-align:center; font-weight:900; font-size:2.8mm; letter-spacing:.3mm; padding:.5mm; border:.3mm solid #000; }
.sl-store.fz { background:#000; color:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.sl-foot { display:flex; justify-content:space-between; font-size:2.1mm; color:#222; }
@media screen { .sl-preview .sl-page { margin-bottom:6mm; } .sl-preview .sl-sheet { outline:1px dashed #bbb; outline-offset:2mm; } .sl-preview .sl-thermal { box-shadow:0 1px 4px rgba(0,0,0,.15); } .sl-print { display:none; } }
/* Print only the label layer, placed directly in <body>, so nothing in the app can offset the pages */
@media print {
  #root { display:none !important; }
  body > *:not(.sl-print) { display:none !important; }
  .sl-print { display:block !important; visibility:visible !important; position:static !important; }
  .sl-print * { visibility:visible !important; }
  html, body { margin:0 !important; padding:0 !important; background:#fff !important; }
}
